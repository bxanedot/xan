name: XAN
packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit.git
    revision: e5b7d0396ce12bf3444f0d209e8436c83373b7af
options:
  bundleIdPrefix: app.xan
  deploymentTarget:
    iOS: '16.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    ARCHS[sdk=iphonesimulator*]: arm64
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
targets:
  XAN:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - project.yml
          - project.generated.yml
          - XAN.xcodeproj
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.xan.ios
        PRODUCT_NAME: XAN
        MARKETING_VERSION: 1.0.3
        CURRENT_PROJECT_VERSION: 4
    preBuildScripts:
      - name: Build shared Kotlin framework
        script: |
          cd "$SRCROOT/.."
          ../android/gradlew -p . :iosShared:embedAndSignAppleFrameworkForXcode
    dependencies:
      - package: YouTubeKit
      - framework: ../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)/XanShared.framework
        embed: false
        codeSign: false

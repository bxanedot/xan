// Classes the Compose compiler must treat as stable.
//
// The external modules and plain data modules apply no Compose compiler plugin,
// so none of their models carry @StabilityInferred metadata and the compiler
// treats every one of them as unconditionally unstable. That made rows and tiles
// non-skippable across the entire app, recomposing on every parent update.
//
// Safe to declare: these are immutable data models and entities whose properties
// are immutable vals, so equals() is a correct skip test.

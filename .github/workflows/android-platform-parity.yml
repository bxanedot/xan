name: Android Platform Parity

on:
  pull_request:
    paths:
      - "mobile/android/**"
      - "desktop/**"
      - "mobile/ios/**"
      - "tools/check_android_platform_parity.py"
      - "tools/tests/test_android_platform_parity.py"
      - ".github/workflows/android-platform-parity.yml"
  push:
    branches: [main]
    paths:
      - "mobile/android/**"
      - "desktop/**"
      - "mobile/ios/**"
      - "tools/check_android_platform_parity.py"
      - "tools/tests/test_android_platform_parity.py"
      - ".github/workflows/android-platform-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-platform-parity-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect Android/platform drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - name: Sync current Android logo assets into platform resources
        run: python tools/check_android_platform_parity.py --sync-assets-only
      - name: Test the parity detector and synced resources
        run: python -m unittest discover -s tools/tests -p "test_android_platform_parity.py" -v
      - name: Report Android changes and platform coverage
        env:
          ANDROID_PARITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          ANDROID_PARITY_HEAD: ${{ github.event.pull_request.head.sha || github.event.after || github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python tools/check_android_platform_parity.py

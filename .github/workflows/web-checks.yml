name: Website checks
on:
  push:
    paths: ["web/**", ".github/workflows/web-checks.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web-checks.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

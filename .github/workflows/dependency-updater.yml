name: Dependency + Source Updater

on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      allow_major:
        description: "Allow major-version dependency updates"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: xan-dependency-updater
  cancel-in-progress: false

jobs:
  update-dependencies:
    runs-on: windows-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compile SDK
        shell: pwsh
        run: sdkmanager "platforms;android-37"

      - name: Configure Git
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update dependencies and migrate source
        id: update
        shell: pwsh
        run: |
          $args = @()
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.allow_major }}" -eq "true") {
            $args += "-AllowMajor"
          }

          & .\tools\update\update_dependencies.ps1 @args
          & .\tools\update\update_source.ps1

          git diff -- .

          if (git diff --quiet) {
            "changed=false" >> $env:GITHUB_OUTPUT
          } else {
            "changed=true" >> $env:GITHUB_OUTPUT
          }

      - name: Compile-check migrated source
        if: steps.update.outputs.changed == 'true'
        shell: pwsh
        working-directory: mobile/android
        run: |
          .\gradlew.bat :app:compileDebugKotlin --no-configuration-cache --console=plain --warning-mode summary

      - name: Create dependency and source update branch
        if: steps.update.outputs.changed == 'true'
        shell: pwsh
        run: |
          $branch = "automation/dependency-updates"
          git checkout -B $branch
          git add -A
          git commit -m "chore: update dependencies and source compatibility"
          git push origin $branch --force

      - name: Open or update dependency pull request
        if: steps.update.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $branch = "automation/dependency-updates"
          $existing = gh pr list --head $branch --base main --state open --json number --jq ".[0].number"

          $body = @"
          Automated dependency and source-compatibility update generated by XAN.
          
          - Dependency versions are refreshed from their upstream repositories.
          - Registered source migrations are applied for known breaking AndroidX APIs.
          - The Gradle wrapper is updated when an Android Gradle Plugin update requires it.
          - :app:compileDebugKotlin must pass before this branch is pushed.
          - Unknown future source-breaking changes stop the workflow instead of creating a broken update PR.
          "@

          if ($existing) {
            gh pr edit $existing --title "chore: update dependencies and source compatibility" --body $body
          } else {
            gh pr create --base main --head $branch --title "chore: update dependencies and source compatibility" --body $body
          }

      - name: No updates
        if: steps.update.outputs.changed != 'true'
        shell: pwsh
        run: Write-Host "No dependency or source compatibility updates were found."

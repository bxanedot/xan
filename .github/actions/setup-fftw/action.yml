name: 'Setup FFTW for Android'
description: 'Build and cache FFTW static libraries for Android ABIs'

inputs:
  ndk-version:
    description: 'Android NDK version'
    required: false
    default: '30.0.16248370'
  fftw-version:
    description: 'FFTW version to build'
    required: false
    default: '3.3.10'
  api-level:
    description: 'Android API level'
    required: false
    default: '26'

runs:
  using: 'composite'
  steps:
    - name: Cache FFTW libraries
      id: cache-fftw
      uses: actions/cache@v6.1.0
      with:
        path: mobile/android/app/src/main/cpp/vibrafp/third_party/fftw-android
        key: fftw-${{ inputs.fftw-version }}-ndk-${{ inputs.ndk-version }}-api-${{ inputs.api-level }}

    - name: Build FFTW for Android
      if: steps.cache-fftw.outputs.cache-hit != 'true'
      shell: bash
      env:
        NDK_VERSION: ${{ inputs.ndk-version }}
        FFTW_VERSION: ${{ inputs.fftw-version }}
        API: ${{ inputs.api-level }}
        OUT_BASE: mobile/android/app/src/main/cpp/vibrafp/third_party/fftw-android
      run: |
        set -euo pipefail
        NDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/$NDK_VERSION"
        if [ ! -d "$NDK_PATH" ]; then
          sdkmanager "ndk;$NDK_VERSION"
        fi

        if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
          echo "ERROR: Could not find Android NDK"
          exit 1
        fi

        echo "Using NDK at: $NDK_PATH"
        cd mobile/android/app/src/main/cpp/vibrafp/third_party
        chmod +x build-fftw-android.sh
        ./build-fftw-android.sh --ndk "$NDK_PATH" --out "$GITHUB_WORKSPACE/$OUT_BASE" --version "$FFTW_VERSION" --api "$API"
        
    - name: Verify FFTW installation
      shell: bash
      run: |
        echo "FFTW installation:"
        ls -la mobile/android/app/src/main/cpp/vibrafp/third_party/fftw-android/ || echo "fftw-android directory not found"
        for abi in arm64-v8a armeabi-v7a x86_64 x86; do
          if [ -f "mobile/android/app/src/main/cpp/vibrafp/third_party/fftw-android/$abi/lib/libfftw3.a" ]; then
            echo "✓ $abi: libfftw3.a found"
          else
            echo "✗ $abi: libfftw3.a NOT found"
          fi
        done
